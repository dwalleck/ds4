name: Windows port host regressions

on:
  push:
    branches: [windows-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build existing CPU targets
        run: make -j2 cpu tests/test_session_state tests/test_gpu_args tests/test_prompt_prefix
      - name: Exercise CPU frontends and serialization
        run: |
          for program in ds4 ds4-server ds4-bench ds4-eval ds4-agent; do
            ./"$program" --help
          done
          ./tests/test_session_state
          ./tests/test_gpu_args
          ./tests/test_prompt_prefix
      - name: Exercise server and agent without a model
        run: |
          core="ds4_cpu.o ds4_image.o ds4_distributed.o ds4_tp.o ds4_ssd.o ds4_layer_pack.o"
          cc -O2 -std=c11 -D_GNU_SOURCE -DDS4_NO_GPU -I. -o ds4_test \
            tests/ds4_test.c ds4_help.c ds4_kvstore.c rax.c ds4_gpu_args.c \
            $core -pthread -lm
          cc -O2 -std=c11 -D_GNU_SOURCE -DDS4_NO_GPU -I. -o ds4_agent_test \
            tests/ds4_agent_test.c ds4_help.c ds4_prompt_prefix.c ds4_web.c \
            ds4_kvstore.c linenoise.c ds4_gpu_args.c $core -pthread -lm
          ./ds4_test --server
          ./ds4_agent_test
